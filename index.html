<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#11100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FORM — A Quiet Card Game</title>

<style>
:root{
  --bg:#0c0b0a;
  --panel:rgba(24,22,19,.88);
  --panel2:rgba(35,32,27,.92);
  --line:rgba(255,255,255,.10);
  --line2:rgba(255,255,255,.18);
  --text:#f2eee5;
  --muted:#9e988c;
  --gold:#c7a76a;
  --gold2:#e2c88f;
  --green:#556d58;
  --danger:#a75d52;
  --card:#eee8da;
  --cardInk:#26231e;
  --shadow:0 24px 70px rgba(0,0,0,.45);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    -apple-system,BlinkMacSystemFont,
    "SF Pro Display","SF Pro Text",
    "Noto Sans TC","PingFang TC",
    sans-serif;
}

button{
  font:inherit;
  color:inherit;
}

#app{
  position:fixed;
  inset:0;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 38%,#27231c 0%,#15130f 42%,#0a0908 100%);
}

#scene{
  position:absolute;
  inset:0;
}

canvas{
  display:block;
  width:100%;
  height:100%;
}

/* ---------- top HUD ---------- */

.hud{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:20;
  padding:
    max(18px,env(safe-area-inset-top))
    max(18px,env(safe-area-inset-right))
    0
    max(18px,env(safe-area-inset-left));
  pointer-events:none;
}

.hudRow{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brandMark{
  width:34px;
  height:34px;
  border:1px solid rgba(255,255,255,.22);
  border-radius:10px;
  position:relative;
  transform:rotate(45deg);
  background:rgba(255,255,255,.025);
  box-shadow:
    inset 0 0 20px rgba(255,255,255,.025),
    0 8px 30px rgba(0,0,0,.22);
}

.brandMark:after{
  content:"";
  position:absolute;
  inset:8px;
  border:1px solid rgba(199,167,106,.7);
  border-radius:3px;
}

.brandText{
  display:flex;
  flex-direction:column;
  line-height:1;
}

.brandText strong{
  font-size:14px;
  letter-spacing:.26em;
  font-weight:600;
}

.brandText span{
  margin-top:6px;
  color:var(--muted);
  font-size:9px;
  letter-spacing:.18em;
}

.hudRight{
  display:flex;
  align-items:center;
  gap:10px;
  pointer-events:auto;
}

.roundInfo{
  min-width:96px;
  padding:8px 13px;
  border:1px solid var(--line);
  border-radius:13px;
  background:rgba(12,11,9,.54);
  backdrop-filter:blur(14px);
  text-align:right;
}

.roundInfo small{
  display:block;
  color:var(--muted);
  font-size:9px;
  letter-spacing:.15em;
}

.roundInfo strong{
  display:block;
  margin-top:2px;
  font-size:15px;
  font-weight:500;
}

.iconBtn{
  width:42px;
  height:42px;
  border-radius:13px;
  border:1px solid var(--line);
  background:rgba(18,16,14,.64);
  backdrop-filter:blur(14px);
  cursor:pointer;
  display:grid;
  place-items:center;
  transition:
    transform .18s ease,
    background .18s ease,
    border-color .18s ease;
}

.iconBtn:active{
  transform:scale(.94);
}

.pauseIcon{
  width:12px;
  height:14px;
  border-left:2px solid #d9d2c5;
  border-right:2px solid #d9d2c5;
}

/* ---------- bottom interface ---------- */

.bottom{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  pointer-events:none;
  padding:
    0
    max(18px,env(safe-area-inset-right))
    max(18px,env(safe-area-inset-bottom))
    max(18px,env(safe-area-inset-left));
}

.bottomInner{
  max-width:1120px;
  margin:auto;
  position:relative;
}

.statusBar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
  padding:0 5px;
}

.statusText{
  color:#c8c1b5;
  font-size:12px;
  letter-spacing:.04em;
  text-shadow:0 2px 12px #000;
}

.statusText span{
  color:var(--gold2);
}

.deckInfo{
  color:var(--muted);
  font-size:10px;
  letter-spacing:.12em;
}

.handPanel{
  pointer-events:auto;
  position:relative;
  min-height:148px;
  padding:18px 20px 20px;
  border:1px solid rgba(255,255,255,.09);
  border-radius:24px 24px 0 0;
  background:
    linear-gradient(
      180deg,
      rgba(31,29,25,.80),
      rgba(15,14,12,.91)
    );
  backdrop-filter:blur(24px);
  box-shadow:
    0 -12px 50px rgba(0,0,0,.25),
    inset 0 1px 0 rgba(255,255,255,.04);
}

.handHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:11px;
}

.handTitle{
  font-size:10px;
  letter-spacing:.20em;
  color:#aaa398;
  text-transform:uppercase;
}

.handCount{
  color:var(--gold);
  font-size:10px;
}

.hand{
  display:flex;
  justify-content:center;
  align-items:flex-end;
  gap:7px;
  min-height:91px;
  perspective:1000px;
}

.handCard{
  width:57px;
  height:79px;
  flex:0 0 auto;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.22);
  background:
    linear-gradient(145deg,#f8f4ea,#ddd5c5);
  box-shadow:
    0 8px 18px rgba(0,0,0,.30),
    0 1px 0 rgba(255,255,255,.6) inset;
  color:var(--cardInk);
  position:relative;
  cursor:grab;
  user-select:none;
  touch-action:none;
  transform-origin:50% 100%;
  transition:
    transform .22s cubic-bezier(.2,.8,.2,1),
    filter .2s ease,
    box-shadow .2s ease;
}

.handCard:hover{
  transform:translateY(-9px) rotateX(4deg);
  box-shadow:
    0 17px 28px rgba(0,0,0,.38),
    0 1px 0 rgba(255,255,255,.7) inset;
}

.handCard.selected{
  transform:translateY(-17px) rotateX(5deg);
  box-shadow:
    0 22px 35px rgba(0,0,0,.45),
    0 0 0 1px rgba(199,167,106,.65),
    0 1px 0 rgba(255,255,255,.7) inset;
}

.handCard.dragging{
  opacity:.22;
}

.cardInner{
  position:absolute;
  inset:0;
  padding:7px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.cardCorner{
  display:flex;
  flex-direction:column;
  line-height:1;
  gap:3px;
}

.cardNumber{
  font-size:15px;
  font-weight:600;
}

.cardSuit{
  font-size:13px;
  line-height:1;
}

.cardCenter{
  align-self:center;
  font-size:25px;
  opacity:.72;
}

.cardBottom{
  transform:rotate(180deg);
  align-self:flex-end;
}

/* ---------- modal ---------- */

.overlay{
  position:absolute;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px;
  background:rgba(5,5,4,.54);
  backdrop-filter:blur(14px);
}

.overlay.visible{
  display:flex;
}

.modal{
  width:min(430px,100%);
  border-radius:28px;
  border:1px solid rgba(255,255,255,.12);
  background:
    linear-gradient(
      145deg,
      rgba(39,36,31,.96),
      rgba(18,17,15,.97)
    );
  box-shadow:var(--shadow);
  padding:31px;
  text-align:center;
  transform:translateY(14px) scale(.98);
  animation:modalIn .35s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes modalIn{
  to{transform:translateY(0) scale(1)}
}

.modalEyebrow{
  color:var(--gold);
  font-size:9px;
  letter-spacing:.28em;
  margin-bottom:12px;
}

.modal h1{
  margin:0;
  font-size:31px;
  font-weight:500;
  letter-spacing:-.03em;
}

.modal p{
  margin:12px auto 25px;
  max-width:310px;
  color:#a9a297;
  font-size:13px;
  line-height:1.75;
}

.primary{
  width:100%;
  height:52px;
  border:0;
  border-radius:15px;
  background:
    linear-gradient(145deg,#dfc38a,#b89457);
  color:#211b11;
  font-size:13px;
  font-weight:650;
  letter-spacing:.08em;
  cursor:pointer;
  box-shadow:
    0 10px 30px rgba(0,0,0,.30),
    inset 0 1px 0 rgba(255,255,255,.38);
  transition:transform .18s ease,filter .18s ease;
}

.primary:hover{
  filter:brightness(1.06);
}

.primary:active{
  transform:scale(.98);
}

.secondary{
  margin-top:9px;
  width:100%;
  height:48px;
  border:1px solid var(--line2);
  border-radius:14px;
  background:rgba(255,255,255,.035);
  color:#c5beb2;
  cursor:pointer;
}

.winNumber{
  margin:18px 0 26px;
  font-size:62px;
  line-height:1;
  font-weight:300;
  color:var(--gold2);
}

.winLabel{
  color:#8e887e;
  font-size:9px;
  letter-spacing:.20em;
}

/* ---------- tutorial ---------- */

.tutorial{
  position:absolute;
  z-index:80;
  inset:0;
  pointer-events:none;
}

.tutorialCard{
  position:absolute;
  left:50%;
  top:24%;
  width:min(340px,calc(100% - 40px));
  transform:translateX(-50%);
  padding:20px 21px;
  border-radius:19px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(17,16,14,.84);
  backdrop-filter:blur(18px);
  box-shadow:0 20px 60px rgba(0,0,0,.35);
  text-align:center;
  opacity:0;
  animation:tutorialIn .45s .5s forwards;
}

@keyframes tutorialIn{
  to{opacity:1}
}

.tutorialCard strong{
  display:block;
  font-size:15px;
  font-weight:500;
  margin-bottom:7px;
}

.tutorialCard span{
  color:#9c968b;
  font-size:11px;
  line-height:1.7;
}

/* ---------- responsive ---------- */

@media(max-width:700px){
  .hudRow{height:64px}
  .brandText span{display:none}
  .roundInfo{display:none}

  .handPanel{
    padding:15px 10px 14px;
    border-radius:20px 20px 0 0;
  }

  .hand{
    gap:4px;
    min-height:83px;
  }

  .handCard{
    width:clamp(37px,10.3vw,53px);
    height:clamp(61px,15vw,76px);
    border-radius:7px;
  }

  .cardInner{padding:5px}
  .cardNumber{font-size:12px}
  .cardSuit{font-size:10px}
  .cardCenter{font-size:19px}

  .statusBar{margin-bottom:8px}
}

@media(min-width:701px){
  .handCard{width:61px;height:85px}
}

@media(max-height:650px){
  .handPanel{
    min-height:128px;
    padding-top:11px;
  }
  .hand{
    min-height:70px;
  }
  .handCard{
    height:66px;
  }
  .cardCenter{font-size:17px}
}

.hidden{display:none!important}
</style>
</head>

<body>
<div id="app">

  <div id="scene"></div>

  <header class="hud">
    <div class="hudRow">
      <div class="brand">
        <div class="brandMark"></div>
        <div class="brandText">
          <strong>FORM</strong>
          <span>A QUIET CARD GAME</span>
        </div>
      </div>

      <div class="hudRight">
        <div class="roundInfo">
          <small>FORMED</small>
          <strong id="formedCount">0 / 3</strong>
        </div>
        <button class="iconBtn" id="pauseButton" aria-label="Pause">
          <div class="pauseIcon"></div>
        </button>
      </div>
    </div>
  </header>

  <div class="tutorial" id="tutorial">
    <div class="tutorialCard">
      <strong>Build a Form</strong>
      <span>
        將牌放到桌面上。相鄰的連續數字會形成組合。<br>
        一次只放一張牌，放下後立即判定。
      </span>
    </div>
  </div>

  <section class="bottom">
    <div class="bottomInner">

      <div class="statusBar">
        <div class="statusText" id="statusText">
          將一張牌放到桌面
        </div>
        <div class="deckInfo">
          <span id="deckCount">52</span> CARDS
        </div>
      </div>

      <div class="handPanel">
        <div class="handHeader">
          <div class="handTitle">YOUR HAND</div>
          <div class="handCount" id="handCount">13 / 13</div>
        </div>

        <div class="hand" id="hand"></div>
      </div>

    </div>
  </section>

  <div class="overlay" id="pauseOverlay">
    <div class="modal">
      <div class="modalEyebrow">PAUSED</div>
      <h1>Take your time.</h1>
      <p>
        這是一場沒有倒數的遊戲。<br>
        你可以隨時停下來，再回到牌桌。
      </p>
      <button class="primary" id="resumeButton">繼續遊戲</button>
      <button class="secondary" id="restartButton">重新開始</button>
    </div>
  </div>

  <div class="overlay" id="winOverlay">
    <div class="modal">
      <div class="modalEyebrow">FORM COMPLETE</div>
      <h1>Quietly done.</h1>
      <p>
        你完成了這一局。<br>
        沒有分數排名，也沒有倒數。
      </p>

      <div class="winNumber" id="winGroups">3</div>
      <div class="winLabel">FORMS CREATED</div>

      <button class="primary" id="newGameButton">再玩一局</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

<script>
"use strict";

/* =========================================================
   FORM
   One-shot static build
   GitHub Pages / no Vite / no npm
========================================================= */

const CONFIG = {
  HAND_SIZE:13,
  TARGET_GROUPS:3,
  MIN_SEQUENCE:4,
  RANKS:13,
  SUITS:["✦","△","□","◇"],
  SAVE_KEY:"form-one-shot-save-v1",
  TABLE_WIDTH:15,
  TABLE_DEPTH:9,
  CARD_W:1.02,
  CARD_H:1.42,
  CARD_D:.075
};

/* =========================================================
   Utility
========================================================= */

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function uid(){
  return Math.random().toString(36).slice(2)+Date.now().toString(36);
}

/* =========================================================
   RNG
========================================================= */

class RNG{
  constructor(seed){
    this.state=(seed>>>0)||123456789;
  }

  next(){
    let x=this.state;
    x^=x<<13;
    x^=x>>>17;
    x^=x<<5;
    this.state=x>>>0;
    return this.state/4294967296;
  }

  int(max){
    return Math.floor(this.next()*max);
  }

  shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j=this.int(i+1);
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }
}

/* =========================================================
   Cards
========================================================= */

function createDeck(rng){
  const deck=[];

  for(let suit=0;suit<CONFIG.SUITS.length;suit++){
    for(let rank=1;rank<=CONFIG.RANKS;rank++){
      deck.push({
        id:uid(),
        rank,
        suit,
        symbol:CONFIG.SUITS[suit]
      });
    }
  }

  return rng.shuffle(deck);
}

/* =========================================================
   Rule Engine
========================================================= */

function nextRank(rank){
  return rank===13?1:rank+1;
}

function isNext(a,b){
  return nextRank(a.rank)===b.rank;
}

function longestSequence(board){
  if(board.length<CONFIG.MIN_SEQUENCE)return null;

  let best=null;

  for(let start=0;start<board.length;start++){
    let end=start+1;

    while(end<board.length && isNext(board[end-1],board[end])){
      end++;
    }

    const length=end-start;

    if(length>=CONFIG.MIN_SEQUENCE){
      if(!best || length>best.length){
        best={
          start,
          end,
          length,
          cards:board.slice(start,end)
        };
      }
    }
  }

  return best;
}

function evaluate(board){
  const sequence=longestSequence(board);

  if(!sequence){
    return {
      formed:false,
      bonus:false,
      sequence:null
    };
  }

  const sameSuit=sequence.cards.every(
    c=>c.suit===sequence.cards[0].suit
  );

  return {
    formed:true,
    bonus:sameSuit,
    sequence
  };
}

/* =========================================================
   Game State
========================================================= */

function newState(seed){
  const rng=new RNG(seed);
  const deck=createDeck(rng);

  const hand=deck.splice(0,CONFIG.HAND_SIZE);

  return {
    version:1,
    seed,
    rngState:rng.state,
    deck,
    hand,
    board:[],
    completed:[],
    formedGroups:0,
    turn:0,
    paused:false,
    won:false,
    startedAt:Date.now()
  };
}

/* =========================================================
   Persistence
========================================================= */

const Save={
  save(state){
    try{
      localStorage.setItem(
        CONFIG.SAVE_KEY,
        JSON.stringify(state)
      );
    }catch(e){}
  },

  load(){
    try{
      const raw=localStorage.getItem(CONFIG.SAVE_KEY);
      if(!raw)return null;

      const data=JSON.parse(raw);

      if(
        !data ||
        data.version!==1 ||
        !Array.isArray(data.hand) ||
        !Array.isArray(data.board)
      )return null;

      return data;
    }catch(e){
      return null;
    }
  },

  clear(){
    try{
      localStorage.removeItem(CONFIG.SAVE_KEY);
    }catch(e){}
  }
};

/* =========================================================
   Game Engine
========================================================= */

class GameEngine{

  constructor(state){
    this.state=state;
  }

  refill(){
    while(
      this.state.hand.length<CONFIG.HAND_SIZE &&
      this.state.deck.length
    ){
      this.state.hand.push(
        this.state.deck.shift()
      );
    }

    if(
      this.state.hand.length<CONFIG.HAND_SIZE &&
      this.state.deck.length===0
    ){
      const rng=new RNG(
        (this.state.rngState^Date.now())>>>0
      );

      const fresh=createDeck(rng);

      this.state.rngState=rng.state;

      this.state.deck.push(...fresh);
    }

    while(
      this.state.hand.length<CONFIG.HAND_SIZE &&
      this.state.deck.length
    ){
      this.state.hand.push(
        this.state.deck.shift()
      );
    }
  }

  playCard(cardId,index){

    if(this.state.paused || this.state.won){
      return null;
    }

    const handIndex=this.state.hand.findIndex(
      c=>c.id===cardId
    );

    if(handIndex<0)return null;

    const card=this.state.hand.splice(handIndex,1)[0];

    index=clamp(
      index,
      0,
      this.state.board.length
    );

    this.state.board.splice(index,0,card);
    this.state.turn++;

    const result=evaluate(this.state.board);

    if(result.formed){

      const removed=this.state.board.splice(
        result.sequence.start,
        result.sequence.length
      );

      const group={
        id:uid(),
        cards:removed,
        bonus:result.bonus,
        length:removed.length,
        createdAt:Date.now()
      };

      this.state.completed.push(group);

      this.state.formedGroups+=
        result.bonus?2:1;

      this.refill();

      if(
        this.state.formedGroups>=
        CONFIG.TARGET_GROUPS
      ){
        this.state.won=true;
      }

      return {
        card,
        result,
        group,
        won:this.state.won
      };
    }

    this.refill();

    return {
      card,
      result,
      group:null,
      won:false
    };
  }
}

/* =========================================================
   Three.js Scene
========================================================= */

class Scene3D{

  constructor(container){
    this.container=container;

    this.scene=new THREE.Scene();

    this.camera=new THREE.PerspectiveCamera(
      31,
      innerWidth/innerHeight,
      .1,
      100
    );

    this.camera.position.set(
      0,
      10.8,
      11.8
    );

    this.camera.lookAt(0,0,0);

    this.renderer=new THREE.WebGLRenderer({
      antialias:true,
      alpha:true,
      powerPreference:"high-performance"
    });

    this.renderer.setPixelRatio(
      Math.min(devicePixelRatio,2)
    );

    this.renderer.setSize(
      innerWidth,
      innerHeight
    );

    this.renderer.shadowMap.enabled=true;
    this.renderer.shadowMap.type=
      THREE.PCFSoftShadowMap;

    this.renderer.outputColorSpace=
      THREE.SRGBColorSpace;

    this.renderer.toneMapping=
      THREE.ACESFilmicToneMapping;

    this.renderer.toneMappingExposure=.92;

    container.appendChild(this.renderer.domElement);

    this.raycaster=new THREE.Raycaster();
    this.pointer=new THREE.Vector2();

    this.tableGroup=new THREE.Group();
    this.scene.add(this.tableGroup);

    this.cardsGroup=new THREE.Group();
    this.scene.add(this.cardsGroup);

    this.completedGroup=new THREE.Group();
    this.scene.add(this.completedGroup);

    this.createLights();
    this.createEnvironment();
    this.createTable();

    addEventListener(
      "resize",
      ()=>this.resize()
    );

    this.clock=new THREE.Clock();

    this.animate();
  }

  createLights(){

    const ambient=new THREE.HemisphereLight(
      0xbdb7a9,
      0x16120e,
      1.7
    );

    this.scene.add(ambient);

    const key=new THREE.DirectionalLight(
      0xfff3d8,
      3.2
    );

    key.position.set(-5,9,6);
    key.castShadow=true;

    key.shadow.mapSize.set(2048,2048);

    key.shadow.camera.left=-10;
    key.shadow.camera.right=10;
    key.shadow.camera.top=10;
    key.shadow.camera.bottom=-10;

    key.shadow.bias=-.0003;

    this.scene.add(key);

    const rim=new THREE.PointLight(
      0xb89a67,
      18,
      22
    );

    rim.position.set(
      6,
      4,
      -4
    );

    this.scene.add(rim);
  }

  createEnvironment(){

    const floor=new THREE.Mesh(
      new THREE.PlaneGeometry(40,40),
      new THREE.MeshStandardMaterial({
        color:0x090807,
        roughness:.92,
        metalness:.05
      })
    );

    floor.rotation.x=-Math.PI/2;
    floor.position.y=-.55;
    floor.receiveShadow=true;

    this.scene.add(floor);

    const glow=new THREE.Mesh(
      new THREE.CircleGeometry(9,64),
      new THREE.MeshBasicMaterial({
        color:0x29231b,
        transparent:true,
        opacity:.23
      })
    );

    glow.rotation.x=-Math.PI/2;
    glow.position.y=-.51;

    this.scene.add(glow);
  }

  createTable(){

    const tableMat=new THREE.MeshStandardMaterial({
      color:0x242018,
      roughness:.78,
      metalness:.04
    });

    const table=new THREE.Mesh(
      new THREE.BoxGeometry(
        CONFIG.TABLE_WIDTH,
        .52,
        CONFIG.TABLE_DEPTH
      ),
      tableMat
    );

    table.position.y=-.18;
    table.castShadow=true;
    table.receiveShadow=true;

    this.tableGroup.add(table);

    const insetMat=new THREE.MeshStandardMaterial({
      color:0x302b22,
      roughness:.72,
      metalness:.02
    });

    const inset=new THREE.Mesh(
      new THREE.BoxGeometry(
        13.9,
        .12,
        7.9
      ),
      insetMat
    );

    inset.position.y=.105;

    inset.receiveShadow=true;

    this.tableGroup.add(inset);

    const rimMat=new THREE.MeshStandardMaterial({
      color:0x625541,
      roughness:.44,
      metalness:.26
    });

    const rim=new THREE.Mesh(
      new THREE.BoxGeometry(
        14.25,
        .16,
        8.25
      ),
      rimMat
    );

    rim.position.y=.02;

    this.tableGroup.add(rim);

    const inner=new THREE.Mesh(
      new THREE.BoxGeometry(
        13.9,
        .15,
        7.9
      ),
      insetMat
    );

    inner.position.y=.13;

    this.tableGroup.add(inner);

    this.createTableLines();
  }

  createTableLines(){

    const mat=new THREE.LineBasicMaterial({
      color:0x74634b,
      transparent:true,
      opacity:.13
    });

    for(let x=-6;x<=6;x+=2){
      const geo=new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x,.21,-3.7),
        new THREE.Vector3(x,.21,3.7)
      ]);

      const line=new THREE.Line(geo,mat);

      this.tableGroup.add(line);
    }

    for(let z=-3;z<=3;z+=2){
      const geo=new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-6.6,.21,z),
        new THREE.Vector3(6.6,.21,z)
      ]);

      const line=new THREE.Line(geo,mat);

      this.tableGroup.add(line);
    }
  }

  resize(){

    this.camera.aspect=
      innerWidth/innerHeight;

    this.camera.updateProjectionMatrix();

    this.renderer.setSize(
      innerWidth,
      innerHeight
    );
  }

  screenToWorld(clientX,clientY){

    const rect=
      this.renderer.domElement.getBoundingClientRect();

    this.pointer.x=
      ((clientX-rect.left)/rect.width)*2-1;

    this.pointer.y=
      -((clientY-rect.top)/rect.height)*2+1;

    this.raycaster.setFromCamera(
      this.pointer,
      this.camera
    );

    const plane=new THREE.Plane(
      new THREE.Vector3(0,1,0),
      -.24
    );

    const hit=new THREE.Vector3();

    this.raycaster.ray.intersectPlane(
      plane,
      hit
    );

    return hit;
  }

  animate(){

    requestAnimationFrame(
      ()=>this.animate()
    );

    const t=this.clock.getElapsedTime();

    this.tableGroup.rotation.y=
      Math.sin(t*.06)*.002;

    this.cardsGroup.children.forEach(
      (card,i)=>{
        if(card.userData.idle){
          card.position.y+=
            Math.sin(t*1.3+i)*.0007;
        }
      }
    );

    this.renderer.render(
      this.scene,
      this.camera
    );
  }
}

   3D Card
========================================================= */

function createCardTexture(card,back=false){

  const c=document.createElement("canvas");
  c.width=512;
  c.height=704;

  const ctx=c.getContext("2d");

  if(back){

    const g=ctx.createLinearGradient(
      0,0,512,704
    );

    g.addColorStop(0,"#343029");
    g.addColorStop(1,"#171512");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,512,704);

    ctx.strokeStyle="rgba(221,200,155,.48)";
    ctx.lineWidth=8;
    ctx.strokeRect(30,30,452,644);

    ctx.strokeStyle="rgba(221,200,155,.16)";
    ctx.lineWidth=3;
    ctx.strokeRect(50,50,412,604);

    ctx.translate(256,352);
    ctx.rotate(Math.PI/4);

    ctx.strokeStyle="rgba(221,200,155,.35)";
    ctx.lineWidth=6;
    ctx.strokeRect(-75,-75,150,150);

  }else{

    const g=ctx.createLinearGradient(
      0,0,512,704
    );

    g.addColorStop(0,"#faf7ee");
    g.addColorStop(.5,"#eee8da");
    g.addColorStop(1,"#d7cfbf");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,512,704);

    ctx.strokeStyle="rgba(45,40,33,.25)";
    ctx.lineWidth=5;
    ctx.strokeRect(17,17,478,670);

    ctx.fillStyle="#28241e";

    ctx.font="600 66px -apple-system,sans-serif";
    ctx.textAlign="left";
    ctx.textBaseline="top";
    ctx.fillText(card.rank,43,34);

    ctx.font="48px sans-serif";
    ctx.fillText(card.symbol,46,102);

    ctx.save();

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.font="190px sans-serif";
    ctx.globalAlpha=.68;

    ctx.fillText(
      card.symbol,
      256,
      365
    );

    ctx.globalAlpha=1;

    ctx.font="600 64px -apple-system,sans-serif";
    ctx.fillText(
      card.rank,
      256,
      500
    );

    ctx.font="44px sans-serif";
    ctx.fillText(
      card.symbol,
      256,
      560
    );

    ctx.restore();

    ctx.save();

    ctx.translate(469,650);
    ctx.rotate(Math.PI);

    ctx.font="600 66px -apple-system,sans-serif";
    ctx.fillText(card.rank,0,0);

    ctx.font="48px sans-serif";
    ctx.fillText(card.symbol,2,68);

    ctx.restore();
  }

  const texture=new THREE.CanvasTexture(c);

  texture.colorSpace=
    THREE.SRGBColorSpace;

  texture.anisotropy=4;

  return texture;
}

function createThreeCard(card){

  const front=createCardTexture(card,false);
  const back=createCardTexture(card,true);

  const sideMat=new THREE.MeshStandardMaterial({
    color:0x8d8577,
    roughness:.46,
    metalness:.08
  });

  const frontMat=new THREE.MeshStandardMaterial({
    map:front,
    roughness:.62,
    metalness:.01
  });

  const backMat=new THREE.MeshStandardMaterial({
    map:back,
    roughness:.66,
    metalness:.01
  });

  const materials=[
    sideMat,
    sideMat,
    sideMat,
    sideMat,
    frontMat,
    backMat
  ];

  const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(
      CONFIG.CARD_W,
      CONFIG.CARD_D,
      CONFIG.CARD_H,
      2,2,2
    ),
    materials
  );

  mesh.castShadow=true;
  mesh.receiveShadow=true;

  mesh.userData={
    id:card.id,
    card,
    idle:true
  };

  return mesh;
}

/* =========================================================
   Renderer / Interaction
========================================================= */

class GameRenderer{

  constructor(scene,state){

    this.scene=scene;
    this.state=state;

    this.cardMeshes=new Map();

    this.drag=null;
    this.preview=null;

    this.createPreview();

    this.renderAll();
  }

  createPreview(){

    const geo=new THREE.BoxGeometry(
      CONFIG.CARD_W+.08,
      .025,
      CONFIG.CARD_H+.08
    );

    const mat=new THREE.MeshBasicMaterial({
      color:0xc7a76a,
      transparent:true,
      opacity:0
    });

    this.preview=new THREE.Mesh(
      geo,
      mat
    );

    this.preview.position.y=.25;

    this.scene.cardsGroup.add(
      this.preview
    );
  }

  renderAll(){

    this.renderHand();
    this.renderBoard();
    this.renderCompleted();
  }

  clearGroup(group){

    while(group.children.length){
      const child=group.children.pop();

      if(child.geometry){
        child.geometry.dispose();
      }

      if(Array.isArray(child.material)){
        child.material.forEach(m=>{
          if(m.map)m.map.dispose();
          m.dispose();
        });
      }else if(child.material){
        if(child.material.map)
          child.material.map.dispose();

        child.material.dispose();
      }
    }
  }

  renderHand(){

    this.cardMeshes.forEach(mesh=>{
      if(mesh.parent===this.scene.cardsGroup){
        this.scene.cardsGroup.remove(mesh);
      }
    });

    this.cardMeshes.clear();

    const total=this.state.hand.length;

    this.state.hand.forEach((card,i)=>{

      const mesh=createThreeCard(card);

      const spread=Math.min(
        7.4,
        total*1.02
      );

      const x=
        total===1
        ?0
        :((i/(total-1))-.5)*spread;

      const normalized=
        total===1
        ?0
        :(i/(total-1))-.5;

      const z=
        3.18+
        Math.abs(normalized)*.12;

      const rotation=
        normalized*.08;

      mesh.position.set(
        x,
        .34,
        z
      );

      mesh.rotation.y=rotation;

      mesh.userData.handIndex=i;

      this.scene.cardsGroup.add(mesh);

      this.cardMeshes.set(
        card.id,
        mesh
      );

      gsap.fromTo(
        mesh.scale,
        {x:.86,y:.86,z:.86},
        {
          x:1,y:1,z:1,
          duration:.35,
          delay:i*.018,
          ease:"back.out(1.4)"
        }
      );
    });
  }

  renderBoard(){

    const old=
      this.scene.cardsGroup.children
        .filter(x=>x!==this.preview);

    old.forEach(mesh=>{
      if(mesh.userData &&
         mesh.userData.card &&
         !this.state.hand.some(
           c=>c.id===mesh.userData.id
         )){
        this.scene.cardsGroup.remove(mesh);
      }
    });

    const board=this.state.board;

    board.forEach((card,i)=>{

      if(
        [...this.scene.cardsGroup.children]
          .some(
            m=>m.userData &&
            m.userData.id===card.id
          )
      )return;

      const mesh=createThreeCard(card);

      const spacing=1.13;

      const x=
        (i-(board.length-1)/2)*spacing;

      mesh.position.set(
        x,
        .27,
        -.05
      );

      mesh.rotation.x=
        -Math.PI/2;

      mesh.rotation.z=
        ((i%3)-1)*.012;

      mesh.userData.idle=true;

      this.scene.cardsGroup.add(mesh);

      gsap.fromTo(
        mesh.position,
        {
          y:1.25,
          z:.7
        },
        {
          y:.27,
          z:-.05,
          duration:.5,
          ease:"power3.out"
        }
      );

      gsap.fromTo(
        mesh.rotation,
        {
          x:-Math.PI/2+.25,
          z:mesh.rotation.z-.12
        },
        {
          x:-Math.PI/2,
          z:mesh.rotation.z,
          duration:.55,
          ease:"power3.out"
        }
      );
    });
  }

  renderCompleted(){

    this.clearGroup(
      this.scene.completedGroup
    );

    this.state.completed.forEach(
      (group,gi)=>{

        const x=
          -5.7+
          (gi%4)*3.8;

        const z=
          -.9+
          Math.floor(gi/4)*1.5;

        group.cards.forEach(
          (card,i)=>{

            const mesh=createThreeCard(card);

            mesh.scale.set(
              .42,.42,.42
            );

            mesh.position.set(
              x+i*.42,
              .235,
              z
            );

            mesh.rotation.x=
              -Math.PI/2;

            mesh.rotation.z=
              (i*.04)-.08;

            this.scene.completedGroup
              .add(mesh);
          }
        );
      }
    );
  }

  raycastHand(clientX,clientY){

    const rect=
      this.scene.renderer.domElement
        .getBoundingClientRect();

    this.scene.pointer.x=
      ((clientX-rect.left)/rect.width)*2-1;

    this.scene.pointer.y=
      -((clientY-rect.top)/rect.height)*2+1;

    this.scene.raycaster.setFromCamera(
      this.scene.pointer,
      this.scene.camera
    );

    const objects=[
      ...this.scene.cardsGroup.children
    ].filter(
      x=>x!==this.preview &&
      x.userData &&
      x.userData.card
    );

    const hits=
      this.scene.raycaster.intersectObjects(
        objects,
        false
      );

    return hits[0]?.object||null;
  }

  updatePreview(world){

    if(!world){
      this.preview.material.opacity=0;
      return;
    }

    const boardLength=
      this.state.board.length;

    const spacing=1.13;

    let index=Math.round(
      (world.x+
       ((boardLength-1)/2)*spacing)/
      spacing
    );

    index=clamp(
      index,
      0,
      boardLength
    );

    const x=
      (index-(boardLength-1)/2)*spacing;

    this.preview.position.set(
      x,
      .30,
      -.05
    );

    this.preview.material.opacity=.28;

    this.preview.userData.index=index;
  }

  hidePreview(){
    this.preview.material.opacity=0;
  }

  beginDrag(mesh,event){

    const card=mesh.userData.card;

    this.drag={
      card,
      mesh,
      pointerId:event.pointerId,
      startX:event.clientX,
      startY:event.clientY,
      moved:false
    };

    mesh.userData.idle=false;

    gsap.to(
      mesh.position,
      {
        y:.9,
        duration:.18,
        ease:"power2.out"
      }
    );

    gsap.to(
      mesh.rotation,
      {
        x:-.08,
        duration:.18
      }
    );

    gsap.to(
      mesh.scale,
      {
        x:1.06,
        y:1.06,
        z:1.06,
        duration:.18
      }
    );
  }

  moveDrag(event){

    if(!this.drag)return;

    const dx=
      event.clientX-this.drag.startX;

    const dy=
      event.clientY-this.drag.startY;

    if(Math.hypot(dx,dy)>8){
      this.drag.moved=true;
    }

    if(!this.drag.moved)return;

    const world=
      this.scene.screenToWorld(
        event.clientX,
        event.clientY
      );

    if(!world)return;

    this.drag.mesh.position.x=
      clamp(world.x,-6.3,6.3);

    this.drag.mesh.position.z=
      clamp(world.z,-3.3,3.0);

    this.drag.mesh.position.y=.75;

    this.drag.mesh.rotation.x=
      -.10;

    this.updatePreview(world);
  }

  endDrag(){

    if(!this.drag)return null;

    const drag=this.drag;

    this.hidePreview();

    gsap.to(
      drag.mesh.scale,
      {
        x:1,
        y:1,
        z:1,
        duration:.18
      }
    );

    this.drag=null;

    return {
      card:drag.card,
      moved:drag.moved,
      index:this.preview.userData.index||0
    };
  }
}

/* =========================================================
   App
========================================================= */

class App{

  constructor(){

    this.state=
      Save.load()||
      newState(
        (Date.now()^
         (Math.random()*0xffffffff))>>>0
      );

    this.engine=
      new GameEngine(this.state);

    this.scene=
      new Scene3D(
        document.getElementById("scene")
      );

    this.renderer=
      new GameRenderer(
        this.scene,
        this.state
      );

    this.lock=false;

    this.cacheDOM();

    this.bind();

    this.updateUI();

    if(this.state.won){
      this.showWin();
    }

    setTimeout(()=>{
      document.getElementById(
        "tutorial"
      ).classList.add("hidden");
    },6000);
  }

  cacheDOM(){

    this.hand=
      document.getElementById("hand");

    this.handCount=
      document.getElementById("handCount");

    this.deckCount=
      document.getElementById("deckCount");

    this.formedCount=
      document.getElementById("formedCount");

    this.statusText=
      document.getElementById("statusText");

    this.pauseOverlay=
      document.getElementById(
        "pauseOverlay"
      );

    this.winOverlay=
      document.getElementById(
        "winOverlay"
      );

    this.pauseButton=
      document.getElementById(
        "pauseButton"
      );
  }

  bind(){

    this.pauseButton.addEventListener(
      "click",
      ()=>this.pause()
    );

    document.getElementById(
      "resumeButton"
    ).addEventListener(
      "click",
      ()=>this.resume()
    );

    document.getElementById(
      "restartButton"
    ).addEventListener(
      "click",
      ()=>this.newGame()
    );

    document.getElementById(
      "newGameButton"
    ).addEventListener(
      "click",
      ()=>this.newGame()
    );

    const canvas=
      this.scene.renderer.domElement;

    canvas.addEventListener(
      "pointerdown",
      e=>this.pointerDown(e)
    );

    canvas.addEventListener(
      "pointermove",
      e=>this.pointerMove(e)
    );

    canvas.addEventListener(
      "pointerup",
      e=>this.pointerUp(e)
    );

    canvas.addEventListener(
      "pointercancel",
      e=>this.pointerUp(e)
    );

    document.addEventListener(
      "visibilitychange",
      ()=>{
        if(document.hidden){
          Save.save(this.state);
        }
      }
    );

    addEventListener(
      "beforeunload",
      ()=>{
        Save.save(this.state);
      }
    );
  }

  pointerDown(e){

    if(
      this.lock ||
      this.state.paused ||
      this.state.won
    )return;

    const mesh=
      this.renderer.raycastHand(
        e.clientX,
        e.clientY
      );

    if(!mesh)return;

    try{
      e.target.setPointerCapture(
        e.pointerId
      );
    }catch(_){}

    this.renderer.beginDrag(
      mesh,
      e
    );

    this.statusText.textContent=
      "拖到桌面上的位置";
  }

  pointerMove(e){

    if(!this.renderer.drag)return;

    this.renderer.moveDrag(e);
  }

  pointerUp(e){

    if(!this.renderer.drag)return;

    const result=
      this.renderer.endDrag();

    if(!result)return;

    if(!result.moved){

      this.cancelCardReturn(
        result.card
      );

      this.statusText.textContent=
        "將一張牌放到桌面";

      return;
    }

    this.play(
      result.card.id,
      result.index
    );
  }

  cancelCardReturn(card){

    const mesh=
      this.renderer.cardMeshes
        .get(card.id);

    if(!mesh)return;

    const index=
      this.state.hand.findIndex(
        c=>c.id===card.id
      );

    const total=this.state.hand.length;

    const spread=Math.min(
      7.4,
      total*1.02
    );

    const normalized=
      total===1
      ?0
      :(index/(total-1))-.5;

    const x=
      total===1
      ?0
      :normalized*spread;

    gsap.to(
      mesh.position,
      {
        x,
        y:.34,
        z:3.18+
          Math.abs(normalized)*.12,
        duration:.35,
        ease:"back.out(1.5)"
      }
    );

    gsap.to(
      mesh.rotation,
      {
        x:0,
        y:normalized*.08,
        z:0,
        duration:.35
      }
    );

    gsap.to(
      mesh.scale,
      {
        x:1,
        y:1,
        z:1,
        duration:.25
      }
    );

    mesh.userData.idle=true;
  }

  play(cardId,index){

    if(this.lock)return;

    this.lock=true;

    const result=
      this.engine.playCard(
        cardId,
        index
      );

    if(!result){
      this.lock=false;
      return;
    }

    this.state=this.engine.state;

    Save.save(this.state);

    if(result.group){

      this.statusText.innerHTML=
        result.result.bonus
        ?'<span>Perfect Form</span> — 雙倍組合'
        :'<span>Form complete</span> — 組合成立';

      this.animateCompletion(
        result.group
      );

    }else{

      this.statusText.textContent=
        "繼續建立下一個組合";

      this.renderer.renderAll();

      setTimeout(()=>{
        this.lock=false;
      },230);
    }

    this.updateUI();

    if(result.won){

      setTimeout(
        ()=>this.showWin(),
        850
      );
    }
  }

  animateCompletion(group){

    const centerX=0;
    const centerZ=-.1;

    const flash=new THREE.Mesh(
      new THREE.RingGeometry(
        .35,
        1.3,
        48
      ),
      new THREE.MeshBasicMaterial({
        color:0xc7a76a,
        transparent:true,
        opacity:.0,
        side:THREE.DoubleSide
      })
    );

    flash.rotation.x=-Math.PI/2;
    flash.position.set(
      centerX,
      .38,
      centerZ
    );

    this.scene.scene.add(flash);

    gsap.to(
      flash.material,
      {
        opacity:.45,
        duration:.15,
        yoyo:true,
        repeat:1
      }
    );

    gsap.to(
      flash.scale,
      {
        x:2.4,
        y:2.4,
        z:2.4,
        duration:.65,
        ease:"power2.out"
      }
    );

    gsap.to(
      flash.material,
      {
        opacity:0,
        duration:.65,
        onComplete:()=>{
          this.scene.scene.remove(flash);
          flash.geometry.dispose();
          flash.material.dispose();
        }
      }
    );

    setTimeout(()=>{
      this.renderer.renderAll();
      this.lock=false;
    },500);
  }

  pause(){

    if(this.state.won)return;

    this.state.paused=true;

    Save.save(this.state);

    this.pauseOverlay.classList.add(
      "visible"
    );
  }

  resume(){

    this.state.paused=false;

    this.pauseOverlay.classList.remove(
      "visible"
    );

    Save.save(this.state);
  }

  newGame(){

    Save.clear();

    const seed=
      (Date.now()^
       (Math.random()*0xffffffff))>>>0;

    this.state=newState(seed);

    this.engine=
      new GameEngine(this.state);

    this.renderer.state=
      this.state;

    this.renderer.renderAll();

    this.pauseOverlay.classList.remove(
      "visible"
    );

    this.winOverlay.classList.remove(
      "visible"
    );

    this.lock=false;

    this.statusText.textContent=
      "將一張牌放到桌面";

    this.updateUI();

    Save.save(this.state);
  }

  showWin(){

    this.state.won=true;

    document.getElementById(
      "winGroups"
    ).textContent=
      this.state.formedGroups;

    this.winOverlay.classList.add(
      "visible"
    );
  }

  updateUI(){

    this.handCount.textContent=
      `${this.state.hand.length} / ${CONFIG.HAND_SIZE}`;

    this.deckCount.textContent=
      this.state.deck.length;

    this.formedCount.textContent=
      `${this.state.formedGroups} / ${CONFIG.TARGET_GROUPS}`;

    this.hand.innerHTML="";

    this.state.hand.forEach(
      (card,i)=>{

        const el=
          document.createElement("div");

        el.className="handCard";

        el.dataset.id=card.id;

        el.innerHTML=`
          <div class="cardInner">
            <div class="cardCorner">
              <div class="cardNumber">${card.rank}</div>
              <div class="cardSuit">${card.symbol}</div>
            </div>

            <div class="cardCenter">${card.symbol}</div>

            <div class="cardCorner cardBottom">
              <div class="cardNumber">${card.rank}</div>
              <div class="cardSuit">${card.symbol}</div>
            </div>
          </div>
        `;

        this.hand.appendChild(el);
      }
    );
  }
}

/* =========================================================
   Boot
========================================================= */

window.addEventListener(
  "DOMContentLoaded",
  ()=>{
    window.FORM=new App();
  }
);
</script>
